[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-os"
version = "0.1.0"
description = "Modular AI Operating System"
readme = "README.md"
requires-python = ">=3.10"

authors = [
    { name = "Le Minh Thanh" }
]

dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88

[tool.pytest.ini_options]
pythonpath = ["src"]